name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

# a second push to main shouldn't race the first one's rollout
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      - name: Typecheck Worker
        run: npx tsc --noEmit

      # deliberately no pip install: none of this imports pandas, and the
      # container build below is what proves requirements.txt resolves
      - name: Check Python syntax
        run: python -m compileall -q app.py demand_engine.py r2_sync.py

      - name: Check r2_sync no-ops without R2 configured
        run: python r2_sync.py check

      # the deploy below builds the image itself, so this only earns its keep on
      # PRs -- where it's the one thing that catches a broken Dockerfile
      - name: Build container image
        if: github.event_name == 'pull_request'
        run: docker build -t pricing-engine .

      # Worker secrets (the R2_* values) are set once with `wrangler secret put`
      # and persist across deploys, so CI never needs them.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
